  <header class="header wrapper">
    <div class="header_content">
      <a class="header_homelink" href="/">
        <img class="header_logo" src="/assets/images/logo.svg" alt="Weather Now Home" width="197" height="40">
      </a>

      <select class="header_dropdown" name="units" id="ddlUnits">
        <option value="">Units</option>
        <option value="C">Celsius</option>
        <option value="F">Fahrenheit</option>
      </select>
    </div>

    <section class="hero">

        <h1 class="hero_title">How's the sky looking today?</h1>

        <div class="hero_search">
          <input class="hero_textbox" type="text" name="search" id="search" placeholder="Search for a place!">
          <button class="hero_button" type="submit">Search</button>
        </div>
      </div>
    </section>

    <div class="dashboard">

        <h2 class="visually-hidden">Current Location Weather </h2>

        <div class="current_weather">

            <div id="dvCurrDate" class="current_date"> </div>
          </div>
          <div class="current_info">
            <div class="current_icon">
              <img id="dvCurrWeatherIcon" src="/assets/images/icon-sunny.webp" alt="icon representing current weather"
                width="120" height="120">
            </div>
            <div id="dvCurrTemp" class="current_temp"><span></span></div>
          </div>
        </div>

        <div class="current_conditions">
          <div class="block current_condition">
            <div class="current_condition-title">Feel Like</div>
            <div id="dvFeelLike" class="current_condition-value"></div>
          </div>

          <div class="block current_condition">
            <div class="current_condition-title">Humidity</div>
            <div id="dvHumidity" class="current_condition-value"></div>
          </div>

          <div class="block current_condition">
            <div class="current_condition-title">Wind</div>
            <div id="dvWind" class="current_condition-value"></div>
          </div>

          <div class="block current_condition">
            <div class="current_condition-title">Precipitation</div>
            <div id="dvPrecipitation" class="current_condition-value"></div>
          </div>
        </div>
      </section>
